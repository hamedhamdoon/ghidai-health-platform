name: ghidai-p1-local
services:
  mailpit:
    image: axllent/mailpit:v1.27.4@sha256:df6c2541907e1be6fac21f509927cf6ed771617a1f4b361ef66d97bd05593d2d
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
    restart: unless-stopped
  postgres-dev:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: ghidai_dev
      POSTGRES_DB: ghidai_development
      POSTGRES_PASSWORD: ${POSTGRES_DEV_PASSWORD:?Run npm run env:init}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - development-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghidai_dev -d ghidai_development"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  postgres-test:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_USER: ghidai_test
      POSTGRES_DB: ghidai_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:?Run npm run env:init}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghidai_test -d ghidai_test"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  development-data:
